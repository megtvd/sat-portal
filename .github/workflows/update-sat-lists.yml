name: Actualizar listas SAT

on:
  schedule:
    # Cada lunes a las 7am hora Ciudad de México (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # También permite correrlo manualmente desde GitHub

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar listas Art. 69
        run: |
          mkdir -p data/69
          mkdir -p data/69b

          BASE_69="http://omawww.sat.gob.mx/cifras_sat/Documents"
          BASE_69B="http://omawww.sat.gob.mx/cifras_sat/Documents"

          echo "Descargando Art. 69..."
          curl -L --retry 3 --retry-delay 5 -o data/69/Cancelados.csv             "$BASE_69/Cancelados.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/No_localizados.csv         "$BASE_69/No_localizados.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/CSDsinefectos.csv          "$BASE_69/CSDsinefectos.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/Exigibles.csv              "$BASE_69/Exigibles.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/Sentencias.csv             "$BASE_69/Sentencias.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/ReduccionArt74CFF.csv      "$BASE_69/ReduccionArt74CFF.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69/EntespublicosydeGobiernoomisos.csv "$BASE_69/EntespublicosydeGobiernoomisos.csv"

          echo "Descargando Art. 69-B..."
          curl -L --retry 3 --retry-delay 5 -o data/69b/Definitivos.csv           "$BASE_69B/Definitivos.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69b/Presuntos.csv             "$BASE_69B/Presuntos.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69b/Desvirtuados.csv          "$BASE_69B/Desvirtuados.csv"
          curl -L --retry 3 --retry-delay 5 -o data/69b/SentenciasFavorables.csv  "$BASE_69B/SentenciasFavorables.csv"

      - name: Verificar que se descargaron
        run: |
          echo "=== Art. 69 ==="
          ls -lh data/69/
          echo "=== Art. 69-B ==="
          ls -lh data/69b/

      - name: Generar meta.json con fecha de actualización
        run: |
          FECHA=$(date -u +"%Y-%m-%d")
          LUNES=$(date -u +"%A, %d de %B de %Y")
          echo "{\"actualizado\": \"$FECHA\", \"descripcion\": \"Listas SAT descargadas el $LUNES\"}" > data/meta.json
          cat data/meta.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Solo hace commit si hay cambios reales
          git diff --staged --quiet || git commit -m "🔄 Listas SAT actualizadas $(date -u +'%Y-%m-%d')"
          git push
